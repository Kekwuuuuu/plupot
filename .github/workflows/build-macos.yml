name: Build macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.1.0)'
        required: false
        default: '1.1.0'

permissions:
  contents: read

env:
  APP_NAME: Plupot
  MAIN_CLASS: com.plupot.Main

jobs:
  build-macos:
    name: build-macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version || '1.1.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: |
          rm -rf out dist
          mkdir -p out dist/jar dist/appimage
          find src -name '*.java' > sources.txt
          javac -encoding UTF-8 -d out @sources.txt
          rm sources.txt

      - name: Copy resources into classpath
        run: |
          mkdir -p out/com/plupot
          cp -R src/com/plupot/res out/com/plupot/

      - name: Build jar
        run: |
          jar --create --file dist/jar/plupot.jar --main-class "$MAIN_CLASS" -C out .
          ls -lh dist/jar/plupot.jar

      - name: Package .app with jpackage
        run: |
          ICON_ARG=""
          if [ -f icon/icon.icns ]; then ICON_ARG="--icon icon/icon.icns"; fi
          jpackage \
            --type app-image \
            --name "$APP_NAME" \
            --app-version "$VERSION" \
            --input dist/jar \
            --main-jar plupot.jar \
            --main-class "$MAIN_CLASS" \
            --mac-package-name "$APP_NAME" \
            --dest dist/appimage \
            $ICON_ARG
          ls -R dist/appimage | head -40

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - "dist/appimage/$APP_NAME.app"
          codesign --verify --depth=1 --verbose=2 "dist/appimage/$APP_NAME.app" || true

      - name: Build DMG
        run: |
          set -euo pipefail
          APP="dist/appimage/$APP_NAME.app"
          STAGE="dist/dmg"
          DMG="dist/$APP_NAME-$VERSION-macos-${{ matrix.arch }}.dmg"
          TMPIMG="dist/tmp.dmg"
          MP="${RUNNER_TEMP:-/tmp}/plupot_dmg"

          echo "Sweeping stale Plupot mounts..."
          for dev in $(hdiutil info | awk '/\/Volumes\/Plupot/ {print $1}'); do
            echo "  detaching $dev"
            hdiutil detach "$dev" -force 2>/dev/null || true
          done

          rm -rf "$STAGE" "$MP" "$TMPIMG" "$DMG"
          mkdir -p "$STAGE" "$MP"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -rf dist/jar

          ok=0
          for i in 1 2 3; do
            echo "=== attempt $i ==="
            hdiutil detach "$MP" -force 2>/dev/null || true
            rm -f "$TMPIMG" "$DMG"

            if hdiutil create -size 500m -fs HFS+ -volname "$APP_NAME $VERSION" \
                 -type UDIF -ov "$TMPIMG" \
               && hdiutil attach "$TMPIMG" -nobrowse -mountpoint "$MP" \
               && cp -R "$STAGE/." "$MP/" \
               && sync \
               && hdiutil detach "$MP" -force \
               && hdiutil convert "$TMPIMG" -format UDZO -o "$DMG"; then
              ok=1
              break
            fi

            echo "attempt $i failed, cleaning up"
            hdiutil detach "$MP" -force 2>/dev/null || true
            rm -f "$TMPIMG" "$DMG"
            sleep 15
          done

          if [ "$ok" != "1" ]; then
            echo "DMG build failed after 3 attempts"
            hdiutil info || true
            df -h || true
            exit 1
          fi

          hdiutil verify "$DMG"
          ls -lh "$DMG"
          rm -f "$TMPIMG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error